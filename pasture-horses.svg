<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="100%">
  <defs>
    <clipPath id="sceneClip">
      <rect width="320" height="110" />
    </clipPath>
  </defs>

  <style>
    /* Mây trôi chầm chậm trên nền trời */
    .cloud-slow {
      animation: driftSlow 45s linear infinite;
    }
    .cloud-mid {
      animation: driftMid 32s linear infinite;
    }
    @keyframes driftSlow {
      0%   { transform: translateX(-30px); }
      100% { transform: translateX(340px); }
    }
    @keyframes driftMid {
      0%   { transform: translateX(330px); }
      100% { transform: translateX(-40px); }
    }

    /* Ngựa nâu cúi đầu gặm cỏ &amp; ngẩng lên nhai */
    .horse1-neck {
      transform-origin: 120px 75px;
      animation: grazeOne 9s steps(3, end) infinite;
    }
    @keyframes grazeOne {
      0%, 18%   { transform: rotate(0deg); }
      26%, 68%  { transform: rotate(42deg) translate(2px, 2px); }
      74%, 100% { transform: rotate(0deg); }
    }

    .horse1-tail {
      transform-origin: 98px 74px;
      animation: tailSwish1 3.6s steps(2, end) infinite;
    }
    @keyframes tailSwish1 {
      0%, 75%, 100% { transform: rotate(0deg); }
      82%, 92%      { transform: rotate(14deg); }
    }

    /* Ngựa trắng cúi gặm cỏ lệch nhịp với ngựa nâu */
    .horse2-neck {
      transform-origin: 206px 70px;
      animation: grazeTwo 11s steps(3, end) infinite;
    }
    @keyframes grazeTwo {
      0%, 48%   { transform: rotate(0deg); }
      56%, 88%  { transform: rotate(-40deg) translate(-2px, 2px); }
      94%, 100% { transform: rotate(0deg); }
    }

    .horse2-tail {
      transform-origin: 227px 69px;
      animation: tailSwish2 4.2s steps(2, end) infinite;
    }
    @keyframes tailSwish2 {
      0%, 60%, 100% { transform: rotate(0deg); }
      68%, 78%      { transform: rotate(-14deg); }
    }

    /* Cỏ và hoa dại đung đưa theo gió */
    .grass-sway-1 {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: sway 3.4s steps(2, end) infinite;
    }
    .grass-sway-2 {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: sway 3.4s steps(2, end) 1.7s infinite;
    }
    @keyframes sway {
      0%, 100% { transform: skewX(0deg); }
      50%      { transform: skewX(-10deg); }
    }

    /* Bướm nhỏ bay lượn trên đồng */
    .butterfly {
      animation: flutter 14s ease-in-out infinite;
    }
    @keyframes flutter {
      0%   { transform: translate(0px, 0px); }
      25%  { transform: translate(18px, -6px); }
      50%  { transform: translate(34px, 2px); }
      75%  { transform: translate(14px, -4px); }
      100% { transform: translate(0px, 0px); }
    }
  </style>

  <g clip-path="url(#sceneClip)">
    
