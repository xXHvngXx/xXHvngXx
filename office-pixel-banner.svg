<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="100%" height="100%">
  <defs>
    
    <radialGradient id="lampGlow" cx="24%" cy="52%" r="36%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="screenGlow" cx="56%" cy="56%" r="32%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .cursor-blink {
      animation: blink 0.9s steps(2, start) infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .code-scroll {
      animation: scrollCode 6s steps(6, end) infinite;
    }
    @keyframes scrollCode {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .steam-1 {
      animation: steamRise 2.8s steps(4, end) infinite;
    }
    .steam-2 {
      animation: steamRise 2.8s steps(4, end) 1.4s infinite;
    }
    @keyframes steamRise {
      0% { transform: translateY(0px); opacity: 0.85; }
      70% { opacity: 0.45; }
      100% { transform: translateY(-6px); opacity: 0; }
    }

    .star-twinkle {
      animation: twinkle 3.2s steps(2, end) infinite;
    }
    .star-twinkle-delay {
      animation: twinkle 3.2s steps(2, end) 1.6s infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.2; }
    }

    .led-pulse {
      animation: ledShift 4s steps(2, end) infinite;
    }
    @keyframes ledShift {
      0%, 100% { fill: #38bdf8; }
      50% { fill: #34d399; }
    }

    .server-blink {
      animation: serverLed 1.4s steps(2, end) infinite;
    }
    @keyframes serverLed {
      0%, 100% { fill: #10b981; }
      50% { fill: #064e3b; }
    }
  </style>

  
