<svg width="100%" height="24" viewBox="0 0 1000 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="amberBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0" />
      <stop offset="15%" stop-color="#D97706" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="1" />
      <stop offset="85%" stop-color="#D97706" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="energyPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="50%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <clipPath id="lineClip">
      <rect x="20" y="10.5" width="960" height="3" rx="1.5" />
    </clipPath>
  </defs>

  
  <rect x="20" y="11" width="960" height="2" rx="1" fill="url(#amberBase)" />

  
  <g clip-path="url(#lineClip)">
    <rect x="-250" y="10" width="250" height="4" fill="url(#energyPulse)">
      <animate attributeName="x" from="-250" to="1000" dur="3.2s" repeatCount="indefinite" />
    </rect>
  </g>

  
  <g transform="translate(500, 12)">
    <circle r="8.5" fill="#0D1117" />
    <circle r="7" stroke="#F59E0B" stroke-width="1.3" stroke-dasharray="6 3" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5" fill="#FDE68A">
      <animate attributeName="r" values="2;3.2;2" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
