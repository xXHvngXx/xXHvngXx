<svg width="100%" height="28" viewBox="0 0 1000 28" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Golden spin divider" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#D97706" stop-opacity="0"/>
    <stop offset="0.15" stop-color="#D97706" stop-opacity="0.7"/>
    <stop offset="0.5" stop-color="#F59E0B"/>
    <stop offset="0.85" stop-color="#D97706" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FDE68A" stop-opacity="0"/>
    <stop offset="1" stop-color="#FFFBEB"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<style>@media (prefers-reduced-motion: reduce){.fx{display:none}}</style>

<rect x="20" y="13" width="450" height="2" rx="1" fill="url(#line)"/>
<rect x="530" y="13" width="450" height="2" rx="1" fill="url(#line)"/>

<g class="fx">
  <g>
    <g>
      <rect x="20" y="12.5" width="130" height="3" rx="1.5" fill="url(#tail)" filter="url(#blur)" opacity="0.8"/>
      <rect x="20" y="13" width="130" height="2" rx="1" fill="url(#tail)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;330 0;330 0" keyTimes="0;0.55;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 0.35 1;0 0 1 1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.5;0.58;1" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(1000 0) scale(-1 1)">
    <g>
      <rect x="20" y="12.5" width="130" height="3" rx="1.5" fill="url(#tail)" filter="url(#blur)" opacity="0.8"/>
      <rect x="20" y="13" width="130" height="2" rx="1" fill="url(#tail)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;330 0;330 0" keyTimes="0;0.55;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 0.35 1;0 0 1 1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.5;0.58;1" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>
</g>

<g transform="translate(500 14)">
  <g class="fx">
    <circle r="9" stroke="#FDE68A" stroke-width="1.2" fill="none" opacity="0">
      <animate attributeName="r" values="10;10;10;34" keyTimes="0;0.55;0.56;1" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.1 0.6 0.3 1"/>
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.55;0.56;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle r="10" stroke="#B45309" stroke-opacity="0.5" stroke-width="0.8" fill="none"/>
  <circle r="7.5" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="7 3.5" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.6" stroke="#FDE68A" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.3" fill="#FFF7D6" filter="url(#glow)">
    <animate attributeName="r" values="1.9;3;1.9" dur="2.25s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
