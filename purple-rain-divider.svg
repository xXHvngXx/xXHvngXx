<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" height="100%">
  <defs>
    
    <linearGradient id="leftBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8" stop-opacity="0" />
      <stop offset="30%" stop-color="#9333ea" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f5d0fe" stop-opacity="1" />
    </linearGradient>

    
    <linearGradient id="rightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="1" />
      <stop offset="15%" stop-color="#c084fc" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#9333ea" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="dropCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="60%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="neonPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .ring-outer {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinSlow 9s linear infinite;
    }
    .ring-inner {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseRing 2.6s ease-out infinite;
    }
    .ring-inner-delay {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseRing 2.6s ease-out 1.3s infinite;
    }
    .center-drop {
      transform-box: fill-box;
      transform-origin: center;
      animation: dropHover 2.6s ease-in-out infinite;
    }

    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% {
        transform: scale(0.55);
        opacity: 0.95;
      }
      100% {
        transform: scale(1.45);
        opacity: 0;
      }
    }
    @keyframes dropHover {
      0%, 100% { transform: translateY(-2px) scale(1); }
      50% { transform: translateY(2px) scale(0.94); }
    }
  </style>

  
  <rect x="40" y="30.5" width="505" height="3" rx="1.5" fill="url(#leftBeam)" />
  <rect x="655" y="30.5" width="505" height="3" rx="1.5" fill="url(#rightBeam)" />

  
  <circle cx="545" cy="32" r="2.2" fill="#f5d0fe" filter="url(#neonPurple)" />
  <circle cx="655" cy="32" r="2.2" fill="#f5d0fe" filter="url(#neonPurple)" />

  
  <g filter="url(#neonPurple)">
    
    <circle class="ring-outer" cx="600" cy="32" r="20" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="18 13" opacity="0.85" />

    
    <circle class="ring-inner" cx="600" cy="32" r="16" fill="none" stroke="#e879f9" stroke-width="1.5" />
    <circle class="ring-inner-delay" cx="600" cy="32" r="16" fill="none" stroke="#c084fc" stroke-width="1.5" />

    
    <path class="center-drop" d="M600 22 C600 22, 607 30.5, 607 35 C607 38.9, 603.9 42, 600 42 C596.1 42, 593 38.9, 593 35 C593 30.5, 600 22, 600 22 Z" fill="url(#dropCore)" />
  </g>
</svg>
