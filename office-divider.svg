<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="100%">
  <defs>
    <linearGradient id="lineLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
      <stop offset="35%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="lineRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .status-pulse {
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

  
  <rect x="20" y="17" width="500" height="2" rx="1" fill="url(#lineLeft)" />
  <rect x="680" y="17" width="500" height="2" rx="1" fill="url(#lineRight)" />

  
  <rect x="530" y="7" width="140" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
  <circle class="status-pulse" cx="546" cy="18" r="3.2" fill="#10b981" />
  <circle cx="558" cy="18" r="3.2" fill="#38bdf8" opacity="0.85" />
  <circle cx="570" cy="18" r="3.2" fill="#f59e0b" opacity="0.85" />
  <rect x="584" y="16.5" width="72" height="3" rx="1.5" fill="#334155" />
  <rect x="584" y="16.5" width="46" height="3" rx="1.5" fill="#38bdf8" />
</svg>
